# DruckCheck – Produktkonfiguration
#
# Alle Maße beziehen sich auf das ENDFORMAT (fertig geschnittenes Produkt).
#
#   trim_mm            Endformat [Breite, Höhe] in mm (Hoch- oder Querformat werden beide akzeptiert)
#   bleed_mm           geforderte Beschnittzugabe je Seite in mm
#   safety_mm          Sicherheitsabstand vom Endformatrand nach innen, in mm.
#                      Zahl (alle Seiten gleich) oder {top, right, bottom, left}
#   min_dpi            unterhalb: rot (Bild wirkt sichtbar unscharf/pixelig)
#   target_dpi         unterhalb: gelb (noch akzeptabel), ab hier: grün
#   viewing_distance_m typische Betrachtungsdistanz (für Lesbarkeit, Prüfung Teil 2)
#   max_tac            maximaler Gesamtfarbauftrag in % (C+M+Y+K)
#   max_pages          maximale Seitenzahl (z. B. Vorder- und Rückseite = 2)
#   allowed_scales     zulässige Maßstäbe der Druckdaten (1 = 1:1, 0.1 = 1:10)
#
# HINWEIS: Die Werte orientieren sich an gängigen Vorgaben deutscher Online-Druckereien.
# Bitte vor dem Livegang mit den Datenblättern der Zieldruckereien abgleichen.

defaults:
  tolerance_mm: 0.5          # Toleranz für Format- und Beschnittvergleich
  hairline_pt: 0.25          # dünnere Linien gelten als Haarlinie
  hairline_red_pt: 0.1       # noch dünner (oder 0 = "dünnstmöglich"): rot
  rgb_policy: warn           # warn = gelb, error = rot
  spot_policy: warn          # Sonderfarben: warn = gelb, error = rot

products:
  visitenkarte:
    name: "Visitenkarte 85 × 55 mm"
    trim_mm: [85, 55]
    bleed_mm: 2
    safety_mm: 3
    min_dpi: 250
    target_dpi: 300
    viewing_distance_m: 0.3
    max_tac: 300
    max_pages: 2
    allowed_scales: [1]

  flyer_a6:
    name: "Flyer DIN A6"
